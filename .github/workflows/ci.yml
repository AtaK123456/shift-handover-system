name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma config requires a URL even when no database is used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI credentials only; never point these URLs at real data.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      JWT_SECRET: ci-only-integration-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This job has its own disposable PostgreSQL service.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      JWT_SECRET: ci-only-browser-jwt-secret-not-for-production
      PLAYWRIGHT_HTML_OPEN: never
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser suites with isolated servers
        shell: bash
        # Each Playwright invocation starts a fresh server so unrelated suites
        # do not exhaust the production per-IP login limit. Keep every report.
        run: |
          failed=0
          for spec in tests/e2e/*.spec.ts; do
            suite="$(basename "$spec" .spec.ts)"
            if ! PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$suite" \
              npm run test:e2e -- "$spec" --reporter=list,html --output="test-results/$suite"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
