name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma config requires a URL even when no database is used.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI credentials only; never point these URLs at real data.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      JWT_SECRET: ci-only-integration-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This job has its own disposable PostgreSQL service.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shift_ci
      JWT_SECRET: ci-only-browser-jwt-secret-not-for-production
      PLAYWRIGHT_HTML_OPEN: never
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Override the list-only reporter without changing playwright.config.ts.
      - run: npm run test:e2e -- --reporter=list,html
      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
